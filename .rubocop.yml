plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'

Layout/LineLength:
  Max: 120  # 一行120文字までOKに設定

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Rails:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: false  # 毎行の `# frozen_string_literal: true` を不要に

# クラスやモジュールのドキュメントコメントを不要にします
Style/Documentation:
  Enabled: false

# .rubocop.yml
Metrics/ClassLength:
  Max: 150

# 管理画面のコードは長くなりがちなので除外
Metrics/BlockLength:
  Exclude:
    - "app/admin/**/*.rb"

# 管理画面のコードは長くなりがちなので除外
Metrics/MethodLength:
  Exclude:
    - "app/admin/**/*.rb"

# 管理画面のコードは複雑になりがちなので除外
Metrics/AbcSize:
  Exclude:
    - "app/admin/**/*.rb"

# 管理画面のコードは複雑になりがちなので除外
Metrics/CyclomaticComplexity:
  Exclude:
    - "app/admin/**/*.rb"

# 管理画面のコードは複雑になりがちなので除外
Metrics/PerceivedComplexity:
  Exclude:
    - "app/admin/**/*.rb"
